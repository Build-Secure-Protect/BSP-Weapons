modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Required: teams, admins, totem rules and protection come from BSP-Core.
[[dependencies.${mod_id}]]
    modId="bsp_core"
    mandatory=true
    versionRange="${bsp_core_version_range}"
    ordering="AFTER"
    side="BOTH"

# Required: the weapon models and their animations.
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="${geckolib_version_range}"
    ordering="AFTER"
    side="BOTH"

# Optional: region rules for firing, block damage and turrets.
[[dependencies.${mod_id}]]
    modId="bsp_region_guard"
    mandatory=false
    versionRange="${bsp_region_guard_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: kills count for ranks.
[[dependencies.${mod_id}]]
    modId="bsp_rankup"
    mandatory=false
    versionRange="${bsp_rankup_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: weapons follow players between servers.
[[dependencies.${mod_id}]]
    modId="bsp_inventorysync"
    mandatory=false
    versionRange="${bsp_inventorysync_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: gas and infusion recipes for weapon parts.
[[dependencies.${mod_id}]]
    modId="mekanism"
    mandatory=false
    versionRange="${mekanism_version_range}"
    ordering="NONE"
    side="BOTH"
