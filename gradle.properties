org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

mod_id=bsp_weapons
mod_name=BSP-Weapons
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.mrgregles.bsp_weapons
mod_authors=Mrgregles
mod_description=Sci-fi weapons for the Build Secure Protect (BSP) modpack: hand-held, throwable and turret weapons built from interchangeable parts, with machines to make, assemble and enhance them.
mod_archive_name=bsp-weapons

# BSP-Core is required; compiled against the sibling repo's built jar (no published artifact). Build BSP-Core first.
bsp_core_version=1.17.1
bsp_core_version_range=[1.17.1,)
bsp_core_libs=../BSP-Core/build/libs

# Optional BSP mods, compiled against their sibling repos' jars and reached only through compat/ adapters.
bsp_region_guard_version=0.7.0
bsp_region_guard_version_range=[0.7.0,)
bsp_region_guard_libs=../BSP-Region Guard/build/libs
bsp_rankup_version=0.6.0
bsp_rankup_version_range=[0.6.0,)
bsp_rankup_libs=../BSP-RankUp/build/libs
bsp_inventorysync_version=0.8.0
bsp_inventorysync_version_range=[0.8.0,)
bsp_inventorysync_libs=../BSP-InventorySync/build/libs

# GeckoLib is required (animated weapon models); the pack ships 4.7.3.
geckolib_version=4.7.3
geckolib_version_range=[4.7.3,)

# Mekanism is optional (gas and infusion recipes for parts); the pack ships 10.4.16.80. Compile only.
mekanism_version=1.20.1-10.4.16.80
mekanism_version_range=[10.4.0,)
